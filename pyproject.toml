[project]
name = "ai-agent"
version = "1.0.0"
description = "基于 OpenAI API 的工具调用型智能 Agent，支持工具调用、任务规划与记忆系统"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.12.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
ai-agent = "ai_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_agent"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
